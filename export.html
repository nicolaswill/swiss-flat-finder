<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Flats: maybe + shortlist</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<!-- Print page for the PDF export (GET /api/pdf renders it with headless Chrome); also printable from the browser. -->
<style>
  @page { size: A4; margin: 10mm; }
  :root { --text: #1d2330; --muted: #6b7280; --border: #e2e5ea; --panel-2: #f0f2f5; --accent: #2f6fed;
    --st-maybe: #d97706; --st-shortlist: #16a34a; }
  * { box-sizing: border-box; }
  body { margin: 0 auto; max-width: 190mm; font: 8.5pt/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text);
    -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  a { color: var(--accent); text-decoration: none; }
  h1 { font-size: 15pt; margin: 0 0 1mm; }
  h2 { font-size: 11pt; margin: 0; flex: 1; }
  p { margin: .7mm 0; }
  .muted { color: var(--muted); }
  .map { width: 100%; height: 95mm; border: 1px solid var(--border); border-radius: 1.5mm; margin: 2mm 0; }
  .leaflet-container { font: inherit; background: var(--panel-2); }
  .leaflet-control-attribution { font-size: 6pt !important; }
  .num { display: flex; align-items: center; justify-content: center; flex: none; width: 20px; height: 20px; border-radius: 50%;
    color: #fff; font-weight: 700; font-size: 10px; border: 2px solid #fff; box-shadow: 0 0 2px rgba(0,0,0,.6); }
  .st { display: inline-block; color: #fff; border-radius: 1em; padding: 0 .55em; font-size: 7.5pt; font-weight: 600; }
  .st-maybe { background: var(--st-maybe); } .st-shortlist { background: var(--st-shortlist); }
  table { border-collapse: collapse; width: 100%; }
  .summary td, .summary th { border-bottom: 1px solid var(--border); padding: .6mm 1.2mm; text-align: left; vertical-align: top; }
  .summary th { font-size: 7.5pt; color: var(--muted); font-weight: 600; }
  .summary td.r, .summary th.r { text-align: right; white-space: nowrap; }
  .listing { border-top: 2px solid var(--text); margin-top: 5mm; padding-top: 2mm; }
  .listing:first-of-type { break-before: page; margin-top: 0; }
  .top { break-inside: avoid; }
  .head { display: flex; gap: 2mm; align-items: center; }
  .price { font-size: 12pt; font-weight: 700; white-space: nowrap; }
  .meta { margin: .5mm 0 1.5mm; color: var(--muted); overflow-wrap: anywhere; }
  .strip { display: flex; flex-wrap: wrap; gap: 1mm 4mm; background: var(--panel-2); border-radius: 1.5mm; padding: 1.2mm 2.5mm; }
  .strip b { font-size: 9.5pt; }
  .strip span { color: var(--muted); }
  .cols { display: grid; grid-template-columns: 1fr 62mm; gap: 3mm; margin-top: 1.5mm; }
  .cols .map { height: 42mm; margin: 0; }
  .lbl { font-weight: 600; color: var(--muted); text-transform: uppercase; font-size: 7pt; letter-spacing: .04em; margin-right: 1mm; }
  .tag { display: inline-block; border: 1px solid var(--border); border-radius: 1em; padding: 0 .5em; margin-right: 1mm; }
  .badge { display: inline-block; border-radius: 1mm; padding: 0 .45em; margin: 0 1mm .5mm 0; background: #fde8e7; color: #b42318; }
  .note { white-space: pre-wrap; background: #fff4d6; border-radius: 1.5mm; padding: 1mm 2mm; margin-bottom: 1mm; }
  .desc { columns: 2; column-gap: 5mm; font-size: 7.5pt; margin-top: 1.5mm; color: #374151; }
  .desc.plain { white-space: pre-wrap; }
  .desc p, .desc ul, .desc ol { margin: 0 0 1mm; } .desc ul, .desc ol { padding-left: 4mm; }
  .photos { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1mm; margin-top: 1.5mm; }
  .photos img { width: 100%; height: 22mm; object-fit: cover; border-radius: 1mm; break-inside: avoid; background: var(--panel-2); }
  .photos img.broken { display: none; }
  .empty { padding: 20mm 0; text-align: center; color: var(--muted); }
</style>

<main id="out"><p class="muted">Loading…</p></main>
<script src="/static/export.js"></script>
